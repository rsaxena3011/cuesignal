<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueSignal — OBS overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: transparent !important; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
    [hidden] { display: none !important; }
    .cue { position: fixed; left: 4vw; bottom: 6vh; width: min(1000px, 86vw); max-height: 82vh; overflow: hidden; padding: 27px 34px 29px 37px; border: 1px solid rgba(207, 184, 255, .22); border-left: 6px solid #9146ff; border-radius: 15px; background: linear-gradient(110deg, rgba(28, 20, 42, .96), rgba(13, 11, 20, .91)); box-shadow: 0 12px 45px rgba(0, 0, 0, .35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: #d1afff; font-size: clamp(10px, 1.1vw, 15px); font-weight: 750; letter-spacing: 2.3px; text-transform: uppercase; margin: 0 0 13px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a66aff; box-shadow: 0 0 13px #9146ff66; }
    h1 { margin: 0; font-size: clamp(24px, 2.8vw, 46px); font-weight: 650; line-height: 1.23; letter-spacing: -.8px; overflow-wrap: anywhere; text-wrap: pretty; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 19px; color: #beb0cd; font-size: clamp(12px, 1.2vw, 17px); line-height: 1.5; }
    .meta strong { color: #f1e9ff; font-weight: 650; }
    .separator { color: #6e597e; }
    .boosts { color: #d2afff; }
    @media (max-width: 600px) { .cue { left: 5vw; width: 90vw; padding: 21px 23px; border-left-width: 4px; border-radius: 11px; } h1 { letter-spacing: -.4px; } .eyebrow { letter-spacing: 1.7px; } .meta { margin-top: 15px; } }
    @media (prefers-reduced-motion: no-preference) { .cue.enter { animation: appear .3s ease-out; } @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <section class="cue" id="cue" hidden aria-live="polite" aria-label="Featured chat cue">
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span>From the chat</p>
    <h1 id="question"></h1>
    <div class="meta"><span>Asked <strong id="count"></strong> <span id="times"></span></span><span class="separator" aria-hidden="true">/</span><span class="boosts"><strong id="boosts"></strong> <span id="boost-label"></span></span></div>
  </section>
  <script>
    const card = document.getElementById('cue');
    let featuredId = null;
    let loading = false;

    function hide() {
      card.hidden = true;
      card.classList.remove('enter');
      featuredId = null;
    }

    async function refresh() {
      if (loading) return;
      loading = true;
      try {
        const response = await fetch('/api/state', { cache: 'no-store', signal: AbortSignal.timeout(2500) });
        if (!response.ok) throw new Error('State unavailable');
        const { featured } = await response.json();
        if (!featured) { hide(); return; }
        const changed = featuredId !== featured.id;
        document.getElementById('question').textContent = featured.text;
        // count is grouped messages, not a count of distinct chatters.
        document.getElementById('count').textContent = featured.count;
        document.getElementById('times').textContent = featured.count === 1 ? 'time' : 'times';
        document.getElementById('boosts').textContent = featured.boosts;
        document.getElementById('boost-label').textContent = featured.boosts === 1 ? 'boost' : 'boosts';
        card.hidden = false;
        if (changed) {
          card.classList.remove('enter');
          void card.offsetWidth;
          card.classList.add('enter');
        }
        featuredId = featured.id;
      } catch {
        // An unavailable server must never leave a stale question on stream.
        hide();
      } finally {
        loading = false;
      }
    }
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
